name: radarauditor

x-worker: &worker
  build: .
  image: radarauditor-worker:latest
  environment:
    - BROWSER_PROFILE_DIR=/data/browser-profile
    - RADAR_WORK_DIR=/data/work
    - ANALYSIS_PROJECT_DIR=/project
    - CLAUDE_CONFIG_DIR=/home/radar/.claude
    - SUPABASE_URL
    - SUPABASE_SERVICE_KEY
    - GOOGLE_API_KEY
    - BROWSER_CHANNEL
    - EVENT_ENDPOINT
    - DATAFORSEO_LOGIN
    - DATAFORSEO_PASSWORD
    - APIFY_TOKEN
    - DATAFORSEO_EUR_PER_USD
    - DATAFORSEO_URL
    - DATAFORSEO_TASK_TIMEOUT_SECONDS
    - DATAFORSEO_POLL_SECONDS
    - APIFY_EUR_PER_USD
    - GOOGLE_EUR_PER_USD
    - OPENAI_EUR_PER_USD
    - OPENAI_API_KEY
    - OPENAI_MODEL
    - CLAUDE_MODEL
    - CLAUDE_CODE_OAUTH_TOKEN
    - CLAUDE_PARALLEL_QUESTIONS
    - ASSISTANT_TIMEOUT_SECONDS
    - CHATGPT_WINDOWS
    - HANDOFF_TIMEOUT_SECONDS
    - ASSISTANT_HANDOFF
    - ESTIMATE_BEFORE_START
    - AI_MODE_TIMEOUT_SECONDS
    - AI_MODE_POLL_SECONDS
    - PREFLIGHT_ROUTES
    - HALT_STAGES
    - NTFY_SERVER
    - NTFY_TOPIC
    - NTFY_TOKEN
    - GOOGLE_OAUTH_CLIENT_ID
    - GOOGLE_OAUTH_CLIENT_SECRET
    - ANALYSIS_CLAUDE_COMMAND
    - ANALYSIS_TIMEOUT_SECONDS
    - ANALYSIS_PERMISSION_MODE
    - ANALYSIS_MODEL
    - CONTROL_MODEL
    - CONTROL_TIMEOUT_SECONDS
    - CONTROL_BUNDLE_SIZE
    - AUDIT_MANAGER_ENABLED
    - AUDIT_MANAGER_TIMEOUT_SECONDS
    - AUDIT_MANAGER_MODEL
    - REPAIR_TIMEOUT_SECONDS
    - REPORT_SHOW_COSTS
    - MAIL_TRIAGE_BATCH
    - MAIL_TRIAGE_TIMEOUT_SECONDS
    - MAIL_TRIAGE_CLAIM_SECONDS
    - MAIL_TRIAGE_MODEL
    - SPEECH_URL
    - SPEECH_TIMEOUT_SECONDS
    - COCKPIT_ASSISTANT_POLL_SECONDS
    - COCKPIT_ASSISTANT_TIMEOUT_SECONDS
    - COCKPIT_ASSISTANT_MODEL
  volumes:
    - browser-profile:/data/browser-profile
    - claude-login:/home/radar/.claude
    - work:/data/work
    - ${PROJECT_DIR:-.}:/project
  extra_hosts:
    - "host.docker.internal:host-gateway"
  hostname: radarauditor
  shm_size: 1gb

services:
  worker:
    <<: *worker
    restart: always

  login:
    <<: *worker
    profiles: [login]
    command: ["browser-login"]
    restart: "no"
    ports:
      - "127.0.0.1:6080:6080"
    healthcheck:
      disable: true

volumes:
  browser-profile:
  claude-login:
  work:
