measurements:
  crawler:
    label: Website lesen
    routes:
      - {supplier: website_crawler, endpoint: "HTTP-Abruf der Seiten, robots.txt, Sitemap", key: null, built: true}
  pagespeed:
    label: Ladezeit
    routes:
      - {supplier: google_pagespeed, endpoint: "https://www.googleapis.com/pagespeedonline/v5/runPagespeed", key: GOOGLE_API_KEY, built: true}
  places:
    label: Google-Profil und Karte
    routes:
      - {supplier: places_api, endpoint: "https://places.googleapis.com/v1/places:searchText", key: GOOGLE_API_KEY, built: true, price_source: "https://developers.google.com/maps/billing-and-pricing/pricing", price_read_on: "2026-11-15"}
      - {supplier: dataforseo, endpoint: "/v3/business_data/google/my_business_info und /v3/serp/google/maps", key: DATAFORSEO_LOGIN, built: true}
      - {supplier: browser, endpoint: "Google Maps im Browser", key: null, built: true}
  serp:
    label: Suchergebnisse
    routes:
      - {supplier: dataforseo, endpoint: "/v3/serp/google/organic und /v3/serp/google/ai_mode", key: DATAFORSEO_LOGIN, built: true}
      - {supplier: apify, endpoint: "Google-Suche-Akteur", key: APIFY_TOKEN, built: true}
      - {supplier: browser, endpoint: "https://www.google.de/search", key: null, built: true}
    variants:
      bing:
        - {supplier: browser, endpoint: "https://www.bing.com/search", key: null, built: true}
        - {supplier: dataforseo, endpoint: "/v3/serp/bing/organic", key: DATAFORSEO_LOGIN, built: false, bestaetigt: false, note: "Bei der Erprobung am 13.11.2026 lieferte DataForSEO bei Namenssuchen fremde Treffer (Foren, Namensseiten); deshalb steht der Browser vorn, bis ein Vergleich besteht."}
      google_images:
        - {supplier: dataforseo, endpoint: "/v3/serp/google/images", key: DATAFORSEO_LOGIN, built: false}
        - {supplier: apify, endpoint: "johnvc~google-images-api", key: APIFY_TOKEN, built: true}
        - {supplier: browser, endpoint: "https://www.google.de/search?tbm=isch", key: null, built: true}
  directories:
    label: Karten-Einträge
    routes: []
    variants:
      apple_maps:
        - {supplier: apple_maps_server_api, endpoint: "https://maps-api.apple.com/v1/search", key: APPLE_MAPS_TOKEN, built: false}
        - {supplier: apify, endpoint: "zen-studio~apple-maps-scraper-pro", key: APIFY_TOKEN, built: true}
      bing_maps:
        - {supplier: apify, endpoint: "karamelo~bing-maps-scraper", key: APIFY_TOKEN, built: true}
  assistants:
    label: KI-Antworten
    routes: []
    variants:
      chatgpt:
        - {supplier: dataforseo, endpoint: "/v3/ai_optimization/chat_gpt/llm_scraper", key: DATAFORSEO_LOGIN, built: true}
        - {supplier: browser, endpoint: "ChatGPT im Browser", key: null, built: true}
        - supplier: openai_api
          endpoint: "https://api.openai.com/v1/chat/completions"
          key: OPENAI_API_KEY
          built: true
          price_source: "https://developers.openai.com/api/docs/pricing"
          price_read_on: "2026-11-15"
          usd_per_million_tokens:
            gpt-4o-mini: {input: "0.15", output: "0.60"}
      google_ai:
        - {supplier: dataforseo, endpoint: "/v3/serp/google/ai_mode", key: DATAFORSEO_LOGIN, built: true}
      claude:
        - {supplier: claude_code, endpoint: "claude (Abo-Schlüssel)", key: CLAUDE_CODE_OAUTH_TOKEN, built: true}
  paid:
    label: Linkdaten und Vergleichsdaten
    routes:
      - {supplier: dataforseo, endpoint: "/v3/backlinks/summary/live, /v3/dataforseo_labs/google/*", key: DATAFORSEO_LOGIN, built: true}
  access:
    label: Zugang des Kunden
    routes:
      - {supplier: google_oauth, endpoint: "Search-Console- und Business-Profile-Performance-Schnittstelle", key: GOOGLE_OAUTH_CLIENT_ID, built: true}
  ads_google:
    label: Anzeigen bei Google
    routes:
      - {supplier: dataforseo, endpoint: "POST https://api.dataforseo.com/v3/serp/google/ads_search/task_post, Ergebnis /v3/serp/google/ads_search/task_get/advanced, Ziel = Domain des Betriebs", key: DATAFORSEO_LOGIN, built: true, price_usd_per_task: "0.0006", price_source: "https://dataforseo.com/pricing/google-serp/google-ads-search-serp-api", price_read_on: "2026-11-15"}
  ads_meta:
    label: Anzeigen bei Facebook und Instagram
    routes:
      - supplier: apify
        endpoint: "apify/facebook-ads-scraper"
        key: APIFY_TOKEN
        built: true
        input_url: "https://www.facebook.com/ads/library/?active_status=active&ad_type=all&country=DE&q={name}"
        field_mapping: {}
        bestaetigt: false
        note: "Preis des Akteurs je Abruf nicht hinterlegt; der Schritt läuft erst, wenn price_usd_per_run eingetragen und bestaetigt auf true gesetzt ist."
