areas:
- id: google
  name: Google
  weight: '56.179'
  checks:
  - id: a2
    weight: '4.458'
    name: Die Seite lädt am Handy schnell und ruhig
    why: Wer lange warten muss, springt ab. Google zählt Ladezeit, ein ruhiges Bild und schnelle Reaktion auf Eingaben zur Seitenerfahrung.
    provider: google
    kind: kriterium
    source: https://developers.google.com/search/docs/appearance/page-experience
    measurement: pagespeed
    requires_paid: false
    requires_access: false
    thresholds:
      lcp_good_ms: 2500
      lcp_poor_ms: 4000
      cls_good: 0.1
      cls_poor: 0.25
      inp_good_ms: 200
      inp_poor_ms: 500
      tbt_good_ms: 200
      tbt_poor_ms: 600
    customer_question: Lädt die Seite am Handy schnell, ohne zu springen, und reagiert sie sofort auf Eingaben?
    customer_impact: Jede Sekunde mehr kostet Anrufe, weil Besucher abspringen; Google stuft langsame Seiten zurück.
  - id: a4
    weight: '4.458'
    name: Google kann jede Seite aufnehmen
    why: 'Eine Seite kommt nur in die Google-Suche, wenn Google sie abrufen darf, sie sich ohne Fehler öffnet und nicht ausdrücklich „nicht aufnehmen“ verlangt. Sonst bringt sie keinen einzigen Kunden. Quelle: Google, Technische Anforderungen (developers.google.com/search/docs/essentials/technical).'
    provider: google
    kind: kriterium
    source: https://developers.google.com/search/docs/essentials/technical
    measurement: crawler
    requires_paid: false
    requires_access: false
    thresholds: {}
    customer_question: Darf Google jede Seite Ihrer Website abrufen und in die Suche aufnehmen?
    customer_impact: Eine Seite, die Google nicht abrufen darf, nicht fehlerfrei erhält oder mit „nicht aufnehmen“ oder dem Verweis auf eine andere Adresse versehen ist, erscheint nicht in der Suche und bringt keine Kunden.
  - id: a12
    weight: '1.671'
    name: Der Vorschautext ist nicht gesperrt
    why: Ein Sperrvermerk für den Vorschautext (nosnippet oder max-snippet:0) schließt die Seite als Quelle in Googles Übersichten und Antworten mit künstlicher Intelligenz aus.
    provider: google
    kind: kriterium
    source: https://developers.google.com/search/docs/appearance/ai-features
    measurement: crawler
    requires_paid: false
    requires_access: false
    thresholds: {}
    customer_question: Darf Google zu den Seiten einen Vorschautext zeigen?
    customer_impact: Seiten mit gesperrtem Vorschautext werden in Googles Antworten mit künstlicher Intelligenz nicht als Quelle genannt.
  - id: a11
    weight: '1.671'
    name: Googles künstliche Intelligenz (Gemini) darf die Inhalte verwenden
    why: Sperrt die robots.txt (die Besucherregeln der Website) den Abrufer Google-Extended, nutzt Gemini die Inhalte nicht. Die normale Google-Suche ist davon nicht betroffen.
    provider: google
    kind: kriterium
    source: https://developers.google.com/crawling/docs/crawlers-fetchers/google-common-crawlers
    measurement: crawler
    requires_paid: false
    requires_access: false
    thresholds: {}
    customer_question: Darf Gemini die Inhalte der Website verwenden?
    customer_impact: Bei einer Sperre taucht die Website in Gemini nicht als Quelle auf; die Google-Suche bleibt unberührt.
  - id: a13
    weight: '1.671'
    name: Google sieht dieselbe Seite wie Besucher
    why: "Zeigt eine Seite dem Googlebot (dem Abrufprogramm von Google) anderen Inhalt als Besuchern, gilt das bei Google als Täuschung (verschleiern, englisch „Cloaking“) und kann zum Ausschluss führen. Die Grenzwerte für den Textvergleich sind eine eigene Festlegung (keine Vorgabe des Anbieters)."
    provider: google
    kind: kriterium
    source: https://developers.google.com/search/docs/essentials/spam-policies
    measurement: crawler
    requires_paid: false
    requires_access: false
    thresholds:
      main_text_words: 100
      no_text_words: 10
      compare_from_words: 30
      min_overlap: 0.5
    customer_question: Zeigt die Website Google und Besuchern denselben Inhalt?
    customer_impact: Unterschiedliche Inhalte für Google und Besucher können die Seite aus der Suche werfen.
  - id: a7
    weight: '4.458'
    name: Die Bilder sind beschrieben
    why: Die Bildbeschreibung sagt Suchmaschinen und Menschen mit Sehbehinderung, was ein Bild zeigt. Geprüft wird, bei wie vielen Inhaltsbildern sie vorhanden ist.
    provider: google
    kind: kriterium
    source: https://developers.google.com/search/docs/essentials
    measurement: crawler
    requires_paid: false
    requires_access: false
    thresholds: {}
    customer_question: Haben die Bilder der Website eine Bildbeschreibung?
    customer_impact: Ohne Bildbeschreibung versteht Google nicht, was ein Bild zeigt, und zeigt es seltener.
  - id: b5
    weight: '7.536'
    name: Jede Seite ist über einen lesbaren Link erreichbar
    why: "Google folgt nur Verweisen, die als gewöhnlicher Link (im Seitencode ein Verweis mit Adresse) im Seitentext stehen. Menüs, die nur per Klick-Skript oder Schaltfläche öffnen, führt Google nicht. Eine Seite ohne solchen Link wird kaum gefunden."
    provider: google
    kind: kriterium
    source: https://developers.google.com/search/docs/crawling-indexing/links-crawlable
    measurement: crawler
    requires_paid: false
    requires_access: false
    thresholds: {}
    customer_question: Ist jede Seite über einen echten Link erreichbar?
    customer_impact: Seiten, auf die kein gewöhnlicher Link zeigt, findet Google nicht und zeigt sie nicht in der Suche.
  - id: c4
    weight: '1.313'
    name: Die Suchwörter der Kunden stehen an den auffälligen Stellen
    why: Google erkennt das Thema einer Seite an Titel, Überschrift, Text, Bildbeschreibung und Linktext. Die Prüfung zeigt je Stelle, wo die Suchwörter vorkommen, und meldet Seiten ohne Titel oder mit gleichem Titel.
    provider: google
    kind: kriterium
    source: https://developers.google.com/search/docs/essentials
    measurement: crawler
    requires_paid: false
    requires_access: false
    thresholds: {}
    customer_question: Stehen die Suchwörter der Kunden an den Stellen, die Google liest?
    customer_impact: Google findet nur, was auch dasteht; fehlen die Suchwörter, erscheint die Seite bei diesen Suchen nicht.
  - id: i1
    weight: '1.671'
    name: Verweise von anderen Websites im Vergleich zu den Wettbewerbern
    why: "Jeder Link von einer anderen Seite ist für Google eine Empfehlung. Quellen: Google, Wie Rankings funktionieren (developers.google.com/search/docs/appearance/ranking-systems-guide) und Google, Hilfe zum Unternehmensprofil (support.google.com/business/answer/7091)."
    provider: google
    kind: kriterium
    source: https://developers.google.com/search/docs/appearance/ranking-systems-guide
    measurement: paid
    requires_paid: true
    requires_access: false
    thresholds: {}
